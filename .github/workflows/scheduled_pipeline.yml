name: Scheduled Cloud Data Pipeline

on:
  workflow_dispatch:

jobs:
  process-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pipeline
        env:
          INPUT_FILE: data/input.csv
          OUTPUT_DIR: output
        run: |
          mkdir -p output
          python process_data.py > output/result.txt

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: output/
