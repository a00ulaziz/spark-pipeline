name: Queue Approved Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  queue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Queue after human approval
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          approved="$(
            gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" |
              jq -s --arg author "$PR_AUTHOR" --arg head "$HEAD_SHA" '
                add
                | map(select(
                    .user.type != "Bot"
                    and .user.login != $author
                    and .commit_id == $head
                  ))
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | any(.state == "APPROVED")
              '
          )"

          if [ "$approved" != "true" ]; then
            echo "No current approval from another human reviewer; not queueing."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --auto \
            --squash
